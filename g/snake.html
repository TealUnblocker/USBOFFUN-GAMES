  <style>
    :root{
      color-scheme: dark;
    }
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--page-bg);
      color: var(--fg);
      display:flex; min-height:100vh; align-items:center; justify-content:center;
    }
    * { box-sizing: border-box; }
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:
        radial-gradient(1200px 700px at 50% -10%, rgba(180,220,255,.16), rgba(0,0,0,0) 60%),
        radial-gradient(900px 600px at 90% 20%, rgba(150,255,210,.08), rgba(0,0,0,0) 55%),
        radial-gradient(900px 600px at 10% 80%, rgba(255,170,210,.06), rgba(0,0,0,0) 55%),
        linear-gradient(180deg, #0b0f14, #070a0f);
      color:#e6edf3;
      display:flex; min-height:100vh; align-items:center; justify-content:center;
    }
    .wrap{ width:min(820px, 96vw); padding:16px; }
    .top{
      display:flex; gap:12px; flex-wrap:wrap; align-items:center; justify-content:space-between;
      margin-bottom:12px;
    }
    .stats{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .pill{
      background: var(--panel);
      border:1px solid var(--border);
      border-radius:999px;
      padding:8px 12px;
      font-size:14px;
      backdrop-filter: blur(10px);
    }
    .pill b{ font-weight:800; }

    button.pillToggle{
      border-radius:999px;
      padding:8px 12px;
      font-size:14px;
      font-weight:760;
      background: var(--panel);
      border:1px solid var(--border);
    }
    button.pillToggle:hover{ border-color: var(--border-hover); }
    .btns{ display:flex; gap:8px; flex-wrap:wrap; }
    button{
      background: var(--panel);
      color:#e6edf3;
      border:1px solid var(--border-strong);
      border-radius:12px;
      padding:10px 12px;
      font-weight:760;
      cursor:pointer;
      backdrop-filter: blur(10px);
    }
    button:hover{ border-color: var(--border-hover); }
    button:active{ transform:translateY(1px); }

    canvas{
      width:100%; height:auto; aspect-ratio: 1 / 1;
      border-radius:18px;
      display:block;
      background: var(--canvas-bg);
      border:1px solid var(--border);
      box-shadow: var(--shadow);
      touch-action:none;
    }

    .row{
      display:flex; gap:10px; flex-wrap:wrap; align-items:center;
      margin-top:12px;
    }
    input[type="range"]{ width:220px; accent-color:#a9d1ff; }
    .hint{
      opacity:.82; font-size:13px; margin-top:10px; line-height:1.35;
    }
    .touch{
      display:grid; grid-template-columns: 1fr 1fr 1fr; gap:8px;
      margin-top:12px; user-select:none;
    }
	.touch button{
	  padding:14px 10px;
      font-size:16px;
      color:#e6edf3;
      background: rgba(255,255,255,0.04);
      border:1px solid rgba(255,255,255,0.22);
      border-radius:12px;
    }

   .touch button:active{
      background: rgba(255,255,255,0.12);
    }
    .touch .sp{ visibility:hidden; }
	@media (pointer: coarse) {
     .touch {
     display: grid;
	}
	}
	.touch{ display:none; }

	@media (pointer: coarse){
	.touch{ display:grid; }
	}
    .overlay{
      position:fixed; inset:0; display:none; align-items:center; justify-content:center;
      background:rgba(0,0,0,.62); padding:16px;
    }
    .modal{
      width:min(520px, 92vw);
      background: rgba(10,14,20,.92);
      border:1px solid rgba(150,190,240,.22);
      border-radius:18px;
      padding:16px;
      box-shadow: 0 16px 60px rgba(0,0,0,.6);
      backdrop-filter: blur(12px);
    }
    .modal h2{ margin:0 0 8px 0; font-size:18px; }
    .modal p{ margin:6px 0; opacity:.9; }
    .modal .mini{ opacity:.75; font-size:13px; margin-top:10px; }
    .modal .actions{ display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  
/* Hard override: overlay must never participate in layout (prevents "next to canvas" bug) */
#overlay{
  position: fixed !important;
  top: 0 !important; left: 0 !important; right: 0 !important; bottom: 0 !important;
  width: 100vw !important; height: 100vh !important;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,.62);
  padding: 16px;
  z-index: 9999 !important;
}
@media (pointer: coarse) {
  .hint {
    display: none !important;
  }
}

<body>
  <div class="wrap">
    <div class="top">
      <div class="stats">
        <div class="pill">Score: <b id="score">0</b></div>
        <div class="pill">High: <b id="hiscore">0</b></div>
        <div class="pill">Level: <b id="level">1</b></div>
        <div class="pill">Speed: <b id="speedLabel">10</b></div>
      </div>
      <div class="btns">
        <button id="btnPause">Pause (P)</button>
        <button id="btnRestart">Restart (R)</button>
      </div>
    </div>

    <canvas id="c" width="720" height="720" aria-label="Snake playfield"></canvas>

    <div class="row">
      <span class="pill">Speed</span>
      <input id="speed" type="range" min="6" max="24" value="10" />
            <button id="btnWalls" class="pill pillToggle" type="button" aria-pressed="true">Walls: <b id="wallsLabel">ON</b></button>
      <button id="btnObs" class="pill pillToggle" type="button" aria-pressed="true">Obstacles: <b id="obsLabel">ON</b></button>
      <button id="btnSound" class="pill pillToggle" type="button" aria-pressed="true">Sound: <b id="sndLabel">ON</b></button>
</div>

    <div class="touch" aria-label="Touch controls">
      <button class="sp"></button>
      <button id="tUp">▲</button>
      <button class="sp"></button>
      <button id="tLeft">◀</button>
      <button id="tPause">⏸</button>
      <button id="tRight">▶</button>
      <button class="sp"></button>
      <button id="tDown">▼</button>
      <button class="sp"></button>
    </div>

    <div class="hint">
      Controls: Arrow keys / WASD. Pause: P. Restart: R.
    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="modal">
      <h2 id="ovTitle">Snake</h2>
      <p id="ovLine1"></p>
      <p id="ovLine2"></p>
      <div class="actions">
        <button id="ovPrimary">Start</button>
        <button id="ovSecondary">Close</button>
      </div>
      <div class="mini" id="ovMini"></div>
    </div>
  </div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  const scoreEl = document.getElementById('score');
  const hiEl = document.getElementById('hiscore');
  const levelEl = document.getElementById('level');

  const speedEl = document.getElementById('speed');
  const speedLabel = document.getElementById('speedLabel');

  const btnPause = document.getElementById('btnPause');
  const btnRestart = document.getElementById('btnRestart');

  const btnWalls = document.getElementById('btnWalls');
  const wallsLabel = document.getElementById('wallsLabel');

  const btnObs = document.getElementById('btnObs');
  const obsLabel = document.getElementById('obsLabel');

  const btnSound = document.getElementById('btnSound');
  const sndLabel = document.getElementById('sndLabel');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ovTitle');
  const ovLine1 = document.getElementById('ovLine1');
  const ovLine2 = document.getElementById('ovLine2');
  const ovMini = document.getElementById('ovMini');
  const ovPrimary = document.getElementById('ovPrimary');
  const ovSecondary = document.getElementById('ovSecondary');

  // --- Storage ---
  const LS_HI = 'snake.hiscore.minimal.v1';
  const LS_CFG = 'snake.cfg.minimal.v1';

  // --- Grid ---
  const GRID = 24;
  const CELL = canvas.width / GRID;

  // --- Config ---
  let cfg = {
    wallsOn: true,
    obstaclesOn: true,
    soundOn: true,
    speed: Number(speedEl.value),
};

  function loadCfg(){
    try{
      const raw = localStorage.getItem(LS_CFG);
      if (!raw) return;
      const o = JSON.parse(raw);
      if (typeof o.wallsOn === 'boolean') cfg.wallsOn = o.wallsOn;
      if (typeof o.obstaclesOn === 'boolean') cfg.obstaclesOn = o.obstaclesOn;
      if (typeof o.soundOn === 'boolean') cfg.soundOn = o.soundOn;
      if (Number.isFinite(o.speed)) cfg.speed = Math.max(6, Math.min(24, o.speed));
} catch {}
  }
  function saveCfg(){ localStorage.setItem(LS_CFG, JSON.stringify(cfg)); }

  function loadHi() {
    const v = Number(localStorage.getItem(LS_HI) || 0);
    return Number.isFinite(v) ? v : 0;
  }
  function saveHi(v){ localStorage.setItem(LS_HI, String(v)); }

  // --- Sound (tiny beeps) ---
  let audioCtx = null;
  function beep(freq, dur=0.05, vol=0.045){
    if (!cfg.soundOn) return;
    try{
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'sine';
      o.frequency.value = freq;
      g.gain.value = vol;
      o.connect(g); g.connect(audioCtx.destination);
      o.start();
      o.stop(audioCtx.currentTime + dur);
    } catch {}
  }

  // --- Game state ---
  let snake, dir, nextDir, food, score, hi, alive, paused, started;
  let obstacles = new Set();
  let foodsEaten = 0;
  let level = 1;

  let tickMs = 1000 / cfg.speed;
  let lastTick = 0;

  function randInt(n){ return Math.floor(Math.random()*n); }
  function key(p){ return `${p.x},${p.y}`; }

  function setSpeed(v){
    cfg.speed = v;
    tickMs = 1000 / cfg.speed;
    speedLabel.textContent = String(cfg.speed);
    speedEl.value = String(cfg.speed);
    saveCfg();
  }

  function updateUI(){
    scoreEl.textContent = String(score);
    hiEl.textContent = String(hi);
    levelEl.textContent = String(level);
    wallsLabel.textContent = cfg.wallsOn ? 'ON' : 'OFF';
    obsLabel.textContent = cfg.obstaclesOn ? 'ON' : 'OFF';
    sndLabel.textContent = cfg.soundOn ? 'ON' : 'OFF';
    btnWalls.setAttribute('aria-pressed', String(cfg.wallsOn));
    btnObs.setAttribute('aria-pressed', String(cfg.obstaclesOn));
    btnSound.setAttribute('aria-pressed', String(cfg.soundOn));
speedLabel.textContent = String(cfg.speed);
    btnPause.textContent = paused ? 'Resume (P)' : 'Pause (P)';
  }

  function reset(){
    const mid = Math.floor(GRID/2);
    snake = [{x: mid, y: mid},{x: mid-1, y: mid},{x: mid-2, y: mid}];
    dir = {x: 1, y: 0};
    nextDir = {x: 1, y: 0};

    score = 0;
    alive = true;
    paused = false;
    started = true;

    obstacles = new Set();
    foodsEaten = 0;
    level = 1;

    placeFood();
    updateUI();
    hideOverlay();
    beep(520);
  }

  function placeFood(){
    const occ = new Set(snake.map(key));
    let p;
    do {
      p = {x: randInt(GRID), y: randInt(GRID)};
    } while (occ.has(key(p)) || obstacles.has(key(p)));
    food = p;
  }

  function addObstacleBatch(count){
    if (!cfg.obstaclesOn) return;
    const occ = new Set(snake.map(key));
    occ.add(key(food));
    let tries = 0;
    while (count > 0 && tries++ < 6000){
      const p = {x: randInt(GRID), y: randInt(GRID)};
      const k = key(p);
      const h = snake[0];
      const dist = Math.abs(p.x - h.x) + Math.abs(p.y - h.y);
      if (dist < 4) continue;
      if (occ.has(k) || obstacles.has(k)) continue;
      obstacles.add(k);
      count--;
    }
  }

  function levelUp(){
    level++;
    addObstacleBatch(Math.min(10, 2 + Math.floor(level/2)));
    beep(740, 0.06, 0.05);
  }

  function setDir(dx, dy){
    if (dx === -dir.x && dy === -dir.y) return; // no instant reverse
    nextDir = {x: dx, y: dy};
  }

  function die(reason){
    alive = false;
    paused = false;
    updateUI();
    showOverlay(
      'Game Over',
      `Reason: ${reason}`,
      `Score: ${score}  •  High: ${hi}`,
      'Play again',
      'Close',
      'Tip: keep your turns smooth — sudden zigzags trap you.'
    );
    beep(160, 0.09, 0.05);
    beep(110, 0.12, 0.04);
  }

  function step(){
    if (!alive || paused || !started) return;

    dir = nextDir;
    const head = snake[0];

    let nx = head.x + dir.x;
    let ny = head.y + dir.y;

    if (!cfg.wallsOn) {
      if (nx < 0) nx = GRID-1;
      if (nx >= GRID) nx = 0;
      if (ny < 0) ny = GRID-1;
      if (ny >= GRID) ny = 0;
    } else {
      if (nx < 0 || nx >= GRID || ny < 0 || ny >= GRID) { die('Wall'); return; }
    }

    const newHead = {x:nx, y:ny};
    const ate = (nx === food.x && ny === food.y);

    if (obstacles.has(key(newHead))) { die('Obstacle'); return; }

    const occ = new Set();
    for (let i=0; i<snake.length; i++){
      if (!ate && i === snake.length-1) continue; // tail moves away
      occ.add(key(snake[i]));
    }
    if (occ.has(key(newHead))) { die('Self'); return; }

    snake.unshift(newHead);

    if (ate) {
      score++;
      foodsEaten++;
      beep(620, 0.045, 0.045);

      if (score > hi) { hi = score; saveHi(hi); }
      if (foodsEaten % 5 === 0) levelUp();
      placeFood();
    } else {
      snake.pop();
    }

    updateUI();
  }

  // --- Drawing helpers ---
  function roundRect(x,y,w,h,r){
    const rr = Math.max(0, Math.min(r, w/2, h/2));
    ctx.beginPath();
    ctx.moveTo(x+rr, y);
    ctx.arcTo(x+w, y,   x+w, y+h, rr);
    ctx.arcTo(x+w, y+h, x,   y+h, rr);
    ctx.arcTo(x,   y+h, x,   y,   rr);
    ctx.arcTo(x,   y,   x+w, y,   rr);
    ctx.closePath();
  }

  // --- Inline “graphics” (SVG sprites) ---
  // Everything stays single-file/offline: the sprites are embedded as SVG strings and drawn onto the canvas.
  const SPR = (() => {
    const svgHead = `
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8f3ff"/>
      <stop offset="1" stop-color="#bcd7ff"/>
    </linearGradient>
    <radialGradient id="gl" cx="35%" cy="28%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="12" y="12" width="104" height="104" rx="28" fill="url(#g)"/>
  <rect x="14" y="14" width="100" height="100" rx="26" fill="url(#gl)"/>
  <rect x="12" y="12" width="104" height="104" rx="28" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="4"/>
  <!-- eyes -->
  <circle cx="48" cy="52" r="6" fill="#0b0f14" fill-opacity="0.6"/>
  <circle cx="80" cy="52" r="6" fill="#0b0f14" fill-opacity="0.6"/>
  <!-- tiny nose -->
  <path d="M60 76 L64 82 L68 76" fill="none" stroke="#0b0f14" stroke-opacity="0.35" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>`;

    const svgBody = `
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="gb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9f5ff"/>
      <stop offset="1" stop-color="#cfe2ff"/>
    </linearGradient>
  </defs>
  <rect x="14" y="14" width="100" height="100" rx="30" fill="url(#gb)"/>
  <rect x="14" y="14" width="100" height="100" rx="30" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="4"/>
  <path d="M28 56 C46 34, 82 34, 100 56" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="6" stroke-linecap="round"/>
</svg>`;

    const svgFood = `
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="ga" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#ffd6f0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff6ac0" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b6ffda"/>
      <stop offset="1" stop-color="#48d79a"/>
    </linearGradient>
  </defs>
  <circle cx="64" cy="70" r="34" fill="url(#ga)"/>
  <circle cx="50" cy="62" r="10" fill="#fff" fill-opacity="0.35"/>
  <path d="M64 32 C70 38,72 44,68 52" fill="none" stroke="#6b3f2a" stroke-opacity="0.55" stroke-width="6" stroke-linecap="round"/>
  <path d="M70 36 C92 30,98 46,82 54 C72 58,62 50,70 36 Z" fill="url(#leaf)" fill-opacity="0.95"/>
  <circle cx="64" cy="70" r="34" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="4"/>
</svg>`;

    const svgRock = `
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="gr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6f0ff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#e6f0ff" stop-opacity="0.14"/>
    </linearGradient>
  </defs>
  <path d="M32 98 C18 86,18 64,32 52 C40 34,56 22,74 26 C96 24,110 42,106 64 C112 82,100 102,78 106 C58 112,42 110,32 98 Z"
        fill="url(#gr)" stroke="#ffffff" stroke-opacity="0.14" stroke-width="5" stroke-linejoin="round"/>
  <path d="M44 62 C52 48,72 46,84 56" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="6" stroke-linecap="round"/>
</svg>`
;

    const toImg = (svg) => {
      const img = new Image();
      // base64 avoids utf8 pitfalls on older engines
      img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
      return img;
    };

    return {
      head: toImg(svgHead),
      body: toImg(svgBody),
      food: toImg(svgFood),
      rock: toImg(svgRock),
    };
  })();

  // Minimal “premium” palette (kept for board + fallback)
  let COL = {
    grid: 'rgba(200,230,255,0.055)',
    boardTop: 'rgba(255,255,255,0.03)',
    boardVignette: 'rgba(0,0,0,0.55)',
    shadow: 'rgba(0,0,0,0.22)',
    foodGlow: 'rgba(255,150,210,0.24)',
  };
  function drawBoard(){
    // Base
    ctx.fillStyle = '#070a0f';
    ctx.fillRect(0,0,canvas.width,canvas.height);

    // Subtle top sheen
    const g = ctx.createLinearGradient(0,0,0,canvas.height);
    g.addColorStop(0, COL.boardTop);
    g.addColorStop(0.6, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(0,0,0,0.12)');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,canvas.width,canvas.height);

    // Grid
    ctx.strokeStyle = COL.grid;
    ctx.lineWidth = 1;
    for (let i=1; i<GRID; i++){
      ctx.beginPath(); ctx.moveTo(i*CELL, 0); ctx.lineTo(i*CELL, canvas.height); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i*CELL); ctx.lineTo(canvas.width, i*CELL); ctx.stroke();
    }

    // Vignette
    const v = ctx.createRadialGradient(
      canvas.width*0.5, canvas.height*0.45, canvas.width*0.15,
      canvas.width*0.5, canvas.height*0.55, canvas.width*0.72
    );
    v.addColorStop(0, 'rgba(0,0,0,0)');
    v.addColorStop(1, COL.boardVignette);
    ctx.fillStyle = v;
    ctx.fillRect(0,0,canvas.width,canvas.height);
  }

  function drawShadow(px, py, size, r){
    ctx.save();
    ctx.globalAlpha = 0.22;
    ctx.fillStyle = COL.shadow;
    roundRect(px+2, py+3, size, size, r);
    ctx.fill();
    ctx.restore();
  }

  function drawSprite(img, x, y, w, h, rot=0){
    // Fast path: not yet loaded -> skip
    if (!img || !img.complete || img.naturalWidth === 0) return false;
    if (rot){
      ctx.save();
      ctx.translate(x + w/2, y + h/2);
      ctx.rotate(rot);
      ctx.drawImage(img, -w/2, -h/2, w, h);
      ctx.restore();
    } else {
      ctx.drawImage(img, x, y, w, h);
    }
    return true;
  }

  function headRotation(){
    // dir is current movement direction
    if (dir.x === 1) return 0;
    if (dir.x === -1) return Math.PI;
    if (dir.y === 1) return Math.PI/2;
    return -Math.PI/2; // up
  }

  function draw(){
    drawBoard();

    // Obstacles (rocks)
    if (obstacles.size){
      for (const k of obstacles){
        const [x,y] = k.split(',').map(Number);
        const pad = CELL*0.17;
        const size = CELL - 2*pad;
        const px = x*CELL + pad, py = y*CELL + pad;
        drawShadow(px, py, size, CELL*0.22);
        if (!drawSprite(SPR.rock, px, py, size, size)){
          // fallback block
          ctx.fillStyle = 'rgba(220,235,255,0.18)';
          roundRect(px, py, size, size, CELL*0.22); ctx.fill();
        }
      }
    }

    // Food (glow + apple)
    const t = performance.now() * 0.004;
    const pulse = 0.5 + 0.5*Math.sin(t);
    const padF = CELL*0.10;
    const sizeF = CELL - 2*padF;
    const fpx = food.x*CELL + padF;
    const fpy = food.y*CELL + padF;

    ctx.save();
    ctx.globalAlpha = 0.65;
    ctx.fillStyle = COL.foodGlow;
    ctx.beginPath();
    ctx.arc((food.x+0.5)*CELL, (food.y+0.5)*CELL, CELL*(0.55 + 0.10*pulse), 0, Math.PI*2);
    ctx.fill();
    ctx.restore();

    if (!drawSprite(SPR.food, fpx, fpy, sizeF, sizeF)){
      ctx.fillStyle = '#eaf2ff';
      ctx.beginPath();
      ctx.arc((food.x+0.5)*CELL, (food.y+0.5)*CELL, CELL*0.30, 0, Math.PI*2);
      ctx.fill();
    }

    // Snake: body segments then head on top
    for (let i=snake.length-1; i>=0; i--){
      const p = snake[i];
      const isHead = (i === 0);
      const pad = isHead ? CELL*0.10 : CELL*0.14;
      const size = CELL - 2*pad;
      const px = p.x*CELL + pad;
      const py = p.y*CELL + pad;
      const r = CELL*0.26;

      drawShadow(px, py, size, r);

      if (isHead){
        const rot = headRotation();
        if (!drawSprite(SPR.head, px, py, size, size, rot)){
          ctx.fillStyle = '#dbe7f5';
          roundRect(px, py, size, size, r); ctx.fill();
        }
      } else {
        if (!drawSprite(SPR.body, px, py, size, size)){
          ctx.fillStyle = '#dbe7f5';
          roundRect(px, py, size, size, r); ctx.fill();
        }
      }
    }

    // Paused / Start banner
    if (!started || (paused && alive)) {
      ctx.save();
      ctx.globalAlpha = 0.78;
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(0, canvas.height/2 - 34, canvas.width, 68);
      ctx.globalAlpha = 1;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = '800 20px system-ui, sans-serif';
      ctx.fillStyle = '#e6edf3';
      ctx.fillText(!started ? 'Tap / Press Start' : 'PAUSED', canvas.width/2, canvas.height/2);
      ctx.restore();
    }
  }


  function loop(t){
    if (!lastTick) lastTick = t;
    const dt = t - lastTick;
    if (dt >= tickMs) {
      const steps = Math.min(3, Math.floor(dt / tickMs));
      for (let i=0; i<steps; i++) step();
      lastTick += steps * tickMs;
    }
    draw();
    requestAnimationFrame(loop);
  }

  function togglePause(){
    if (!started) { started = true; hideOverlay(); beep(520); return; }
    if (!alive) return;
    paused = !paused;
    updateUI();
    beep(paused ? 320 : 520, 0.05, 0.04);
  }

  function toggleWalls(){
    cfg.wallsOn = !cfg.wallsOn;
    saveCfg(); updateUI(); beep(420, 0.05, 0.04);
  }

  function toggleObstacles(){
    cfg.obstaclesOn = !cfg.obstaclesOn;
    if (!cfg.obstaclesOn) obstacles = new Set();
    saveCfg(); updateUI(); beep(420, 0.05, 0.04);
  }

  function toggleSound(){
    cfg.soundOn = !cfg.soundOn;
    saveCfg(); updateUI();
    if (cfg.soundOn) beep(600, 0.06, 0.05);
  }

  // --- Overlay ---
  function showOverlay(title, line1, line2, primaryText, secondaryText, miniText){
    ovTitle.textContent = title;
    ovLine1.textContent = line1 || '';
    ovLine2.textContent = line2 || '';
    ovMini.textContent = miniText || '';
    ovPrimary.textContent = primaryText || 'OK';
    ovSecondary.textContent = secondaryText || 'Close';
    overlay.style.display = 'flex';
  }
  function hideOverlay(){ overlay.style.display = 'none'; }

  // --- Input ---
 window.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();

  if (k === 'arrowup' || k === 'w') setDir(0,-1);
  else if (k === 'arrowdown' || k === 's') setDir(0,1);
  else if (k === 'arrowleft' || k === 'a') setDir(-1,0);
  else if (k === 'arrowright' || k === 'd') setDir(1,0);
  else if (k === 'p' || e.code === 'Space') {
    e.preventDefault();      // verhindert Scroll/Space-Page-Down
    togglePause();
  }
  else if (k === 'r') reset();
  else if (k === 'm') toggleSound();
});

  // Touch buttons
  const bind = (id, fn) => document.getElementById(id).addEventListener('click', fn);
  bind('tUp',   () => setDir(0,-1));
  bind('tDown', () => setDir(0,1));
  bind('tLeft', () => setDir(-1,0));
  bind('tRight',() => setDir(1,0));
  bind('tPause',() => togglePause());

  // Swipe + tap
  let sx=0, sy=0, st=0;
  canvas.addEventListener('pointerdown', (e) => {
    canvas.setPointerCapture(e.pointerId);
    sx = e.clientX; sy = e.clientY; st = performance.now();
  });
  canvas.addEventListener('pointerup', (e) => {
    const dx = e.clientX - sx, dy = e.clientY - sy;
    const adx = Math.abs(dx), ady = Math.abs(dy);
    const elapsed = performance.now() - st;

    if (adx < 12 && ady < 12 && elapsed < 250) { togglePause(); return; }
    if (Math.max(adx, ady) < 24) return;

    if (adx > ady) setDir(dx > 0 ? 1 : -1, 0);
    else setDir(0, dy > 0 ? 1 : -1);
  });

  // UI
  btnPause.addEventListener('click', togglePause);
  btnRestart.addEventListener('click', reset);
  btnWalls.addEventListener('click', toggleWalls);
  btnObs.addEventListener('click', toggleObstacles);
  btnSound.addEventListener('click', toggleSound);
speedEl.addEventListener('input', () => setSpeed(Number(speedEl.value)));

  ovPrimary.addEventListener('click', () => {
    if (!started) { started = true; hideOverlay(); beep(520); return; }
    if (!alive) reset();
    else hideOverlay();
  });
  ovSecondary.addEventListener('click', hideOverlay);

  // --- Init ---
  loadCfg();
  hi = loadHi();

  setSpeed(cfg.speed);
  hiEl.textContent = String(hi);

  // Start screen initial state
  alive = true;
  paused = false;
  started = false;
  score = 0;
  level = 1;
  foodsEaten = 0;
  obstacles = new Set();

  const mid = Math.floor(GRID/2);
  snake = [{x:mid,y:mid},{x:mid-1,y:mid},{x:mid-2,y:mid}];
  dir = {x:1,y:0};
  nextDir = {x:1,y:0};
  placeFood();

  updateUI();



  requestAnimationFrame(loop);
})();
</script>
