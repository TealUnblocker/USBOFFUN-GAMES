    <style>
        body { background-color: rgb(53, 53, 53); color: white; font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
        
        .header {
            background-color: rgb(85, 85, 85);
            padding: 15px;
            display: flex;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        #body-content { padding: 40px; text-align: center; }

        /* Folder Buttons (Grid View) */
        .folder-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 30px; }
        .folder-button {
            background-color: gray;
            border-radius: 10px;
            color: white;
            padding: 15px;
            cursor: pointer;
            border: none;
            width: 220px;
            box-shadow: 1.25px 1.25px 1.25px 5px greenyellow;
            transition: transform 0.2s;
        }
        .folder-button:hover { transform: scale(1.05); }
        .folder-button img { width: 180px; height: 180px; border-radius: 10px; object-fit: cover; background: #333; }

        /* Episode List (Vertical View) */
        .file-list { display: flex; flex-direction: column; align-items: center; gap: 15px; }
        .file-button {
            border-radius: 10px;
            background-color: grey;
            width: 90%;
            max-width: 1000px;
            height: 60px;
            font-size: 20px;
            color: white;
            cursor: pointer;
            border: none;
        }
        .file-button:hover { background-color: #777; }

        /* Player View */
        .video-container { width: 100%; max-width: 1200px; margin: 0 auto; background: black; border-radius: 15px; overflow: hidden; }
        video { width: 100%; display: block; aspect-ratio: 16/9; }

        .back-btn {
            border-radius: 10px;
            background-color: #b71c1c;
            color: white;
            padding: 12px 24px;
            cursor: pointer;
            margin-bottom: 20px;
            border: none;
            font-weight: bold;
        }

<td><h1 style="
    
        vertical-align: center;
    size: 10px;
    transform: translate(25%) scale(2.03);
    ">WATCH-IT</h1></td></table>

        <div class="controls">
            <button class="main-btn btn-open" onclick="document.getElementById('folderInput').click()">Load Folder</button>
            <button class="main-btn btn-save" id="btn-save">Save Library</button>
            <input type="file" id="folderInput" webkitdirectory style="display:none">
        </div>
    </div>

    <div id="body-content">
        <h2>Load your library to start</h2>
    </div>

<script>
    let globalFilesMap = new Map();
    let currentPath = ""; 
    let activeObjectURL = null;

    const contentArea = document.getElementById('body-content');

    // --- 1. INDEXEDDB PERSISTENCE ---
    const dbName = "WatchIt_Main_Storage";
    const storeName = "fileData";

    async function openDB() {
        return new Promise((resolve) => {
            const request = indexedDB.open(dbName, 1);
            request.onupgradeneeded = (e) => e.target.result.createObjectStore(storeName);
            request.onsuccess = () => resolve(request.result);
        });
    }

    document.getElementById('btn-save').onclick = async () => {
        const db = await openDB();
        const tx = db.transaction(storeName, "readwrite");
        const store = tx.objectStore(storeName);
        store.clear();
        for (let [path, file] of globalFilesMap) {
            store.put({ blob: file, name: file.name, type: file.type, path: path }, path);
        }
        tx.oncomplete = () => alert("Library Saved Locally!");
    };

    window.onload = async () => {
        const db = await openDB();
        const tx = db.transaction(storeName, "readonly");
        const store = tx.objectStore(storeName);
        const req = store.openCursor();
        req.onsuccess = (e) => {
            const cursor = e.target.result;
            if (cursor) {
                const item = cursor.value;
                const reconstructed = new File([item.blob], item.name, { type: item.type });
                globalFilesMap.set(item.path, reconstructed);
                cursor.continue();
            } else if (globalFilesMap.size > 0) { renderView(""); }
        };
    };

    // --- 2. FOLDER UPLOAD ---
    document.getElementById('folderInput').onchange = (e) => {
        globalFilesMap.clear();
        Array.from(e.target.files).forEach(f => {
            const parts = f.webkitRelativePath.split('/');
            parts.shift(); // Remove root folder name
            const cleanPath = parts.join('/');
            globalFilesMap.set(cleanPath, f);
        });
        renderView("");
    };

    // --- 3. CORE RENDERING ENGINE ---
    function renderView(path = "") {
        currentPath = path;
        contentArea.innerHTML = "";
        
        // Breadcrumb Back Button (One level at a time)
        if (currentPath !== "") {
            const back = document.createElement('button');
            back.className = "back-btn";
            back.innerHTML = "⬅ GO BACK";
            back.onclick = () => {
                const parts = currentPath.split('/');
                parts.pop();
                renderView(parts.join('/'));
            };
            contentArea.appendChild(back);
        }

        const container = document.createElement('div');
        container.className = "folder-grid"; 
        contentArea.appendChild(container);

        const foldersFound = new Set();
        const filesAtLevel = [];

        for (let [filePath, file] of globalFilesMap) {
            if (filePath.startsWith(currentPath)) {
                const relative = currentPath === "" ? filePath : filePath.substring(currentPath.length + 1);
                const parts = relative.split('/');

                if (parts.length > 1) {
                    foldersFound.add(parts[0]);
                } else if (parts[0] !== "") {
                    // Filter: Hide the folder-matching PNG from the list
                    const folderName = currentPath.split('/').pop() || "";
                    const isMatchingPng = parts[0].toLowerCase() === (folderName + ".png").toLowerCase();
                    
                    if (!isMatchingPng) {
                        filesAtLevel.push({ name: parts[0], file: file });
                    }
                }
            }
        }

        // Switch to List view if videos are found
        if (filesAtLevel.some(f => isVideo(f.name))) {
            container.className = "file-list";
            filesAtLevel.forEach(f => {
                if(isVideo(f.name)) createFileButton(f.name, f.file, container);
            });
        }

        // Render Folders
        foldersFound.forEach(folderName => {
            const fullSubPath = currentPath === "" ? folderName : currentPath + "/" + folderName;
            createFolderButton(folderName, fullSubPath, container);
        });
    }

    function createFolderButton(name, fullPath, parent) {
        const btn = document.createElement('button');
        btn.className = "folder-button";
        
        // PNG Matching: Look for "FolderName/FolderName.png"
        const imgPath = fullPath + "/" + name + ".png";
        const imgFile = globalFilesMap.get(imgPath);
        const imgSrc = imgFile ? URL.createObjectURL(imgFile) : "";

        btn.innerHTML = `<img src="${imgSrc}" alt=""><br><b>${name}</b>`;
        btn.onclick = () => renderView(fullPath);
        parent.appendChild(btn);
    }

    function createFileButton(name, file, parent) {
        const btn = document.createElement('button');
        btn.className = "file-button";
        btn.innerText = name.replace(/\.[^/.]+$/, "");
        btn.onclick = () => playVideo(file);
        parent.appendChild(btn);
    }

    // --- 4. VIDEO PLAYER ---
    function playVideo(file) {
        if (activeObjectURL) URL.revokeObjectURL(activeObjectURL);
        activeObjectURL = URL.createObjectURL(file);
        
        contentArea.innerHTML = "";
        const back = document.createElement('button');
        back.className = "back-btn";
        back.innerHTML = "⬅ BACK TO LIST";
        back.onclick = () => renderView(currentPath);
        
        const vidCont = document.createElement('div');
        vidCont.className = "video-container";
        
        const video = document.createElement('video');
        video.controls = true;
        video.autoplay = true;
        video.src = activeObjectURL;
        
        vidCont.appendChild(video);
        contentArea.appendChild(back);
        contentArea.appendChild(vidCont);
    }

    function isVideo(name) { return /\.(mp4|webm|mkv|mov|avi)$/i.test(name); }
</script>
</body>
</html>
