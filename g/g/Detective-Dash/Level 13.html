    /* General styling for the body */
body {
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}

/* The Modal (background) */
.modal {
    display: none; /* Hidden by default */
    position: fixed; /* Stay in place */
    z-index: 1; /* Sit on top */
    left: 0;
    top: 0;
    width: 100%; /* Full width */
    height: 100%; /* Full height */
    background-color: rgba(0,0,0,0.5); /* Black background with opacity/overlay */
    justify-content: center;
    align-items: center;
}

/* Modal Content/Box */
.modal-content {
    background-color: #fefefe;
    padding: 20px;
    border: 1px solid #888;
    width: 50%; /* Could be responsive */
    border-radius: 5px;
    position: relative;
    text-align: center;
}

/* The Close Button (X) */
.close {
    color: #aaa;
    float: right;
    font-size: 28px;
    font-weight: bold;
    cursor: pointer;
    position: absolute;
    top: 10px;
    right: 10px;
}

.close:hover,
.close:focus {
    color: black;
    text-decoration: none;
    cursor: pointer;
}

document.addEventListener("keydown", function(event) {
    switch (event.key) {
        case "a":
            velocityX = -speed;
            break;
        case "d":
            velocityX = speed;
            break;
        case "w":
            // Allow jumping when the character is on the ground or a block
            if (positionY === 0 || isOnBlock()) {
                velocityY = jumpVelocity;
            }
            break;
    }
});

// Helper function to check if the character is on a block
function isOnBlock() {
    const characterRect = character.getBoundingClientRect();
    const blocks = document.querySelectorAll(".block");
    for (const block of blocks) {
        const blockRect = block.getBoundingClientRect();
        if (
            characterRect.bottom >= blockRect.top &&
            characterRect.bottom <= blockRect.bottom + 5 && // Small tolerance for collision
            characterRect.right >= blockRect.left &&
            characterRect.left <= blockRect.right
        ) {
            return true; // Character is on a block
        }
    }
    return false; // Character is not on any block
}
