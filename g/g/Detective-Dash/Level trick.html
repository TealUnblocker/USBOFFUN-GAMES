    /* General styling for the body */
body {
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}

/* The Modal (background) */
.modal {
    display: none; /* Hidden by default */
    position: fixed; /* Stay in place */
    z-index: 1; /* Sit on top */
    left: 0;
    top: 0;
    width: 100%; /* Full width */
    height: 100%; /* Full height */
    background-color: rgba(0,0,0,0.5); /* Black background with opacity/overlay */
    justify-content: center;
    align-items: center;
}

/* Modal Content/Box */
.modal-content {
    background-color: #fefefe;
    padding: 20px;
    border: 1px solid #888;
    width: 50%; /* Could be responsive */
    border-radius: 5px;
    position: relative;
    text-align: center;
}

/* The Close Button (X) */
.close {
    color: #aaa;
    float: right;
    font-size: 28px;
    font-weight: bold;
    cursor: pointer;
    position: absolute;
    top: 10px;
    right: 10px;
}

.close:hover,
.close:focus {
    color: black;
    text-decoration: none;
    cursor: pointer;
}

var openBtn = document.getElementById("openPopupBtn");

var closeBtn = document.getElementsByClassName("close")[0];

// When the user clicks the button, open the modal 
openBtn.onclick = function() {
    modal.style.display = "flex"; // Use flex to center content
}

// When the user clicks on "X" (span), close the modal
closeBtn.onclick = function() {
    modal.style.display = "none";
}

// When the user clicks anywhere outside of the modal content, close it
window.onclick = function(event) {
    if (event.target == modal) {
        modal.style.display = "none";

}

// Helper function to check if the character is on a block
function isOnBlock() {
    const characterRect = character.getBoundingClientRect();
    const blocks = document.querySelectorAll(".block");
    for (const block of blocks) {
        const blockRect = block.getBoundingClientRect();
        if (
            characterRect.bottom >= blockRect.top &&
            characterRect.bottom <= blockRect.bottom + 5 && // Small tolerance for collision
            characterRect.right >= blockRect.left &&
            characterRect.left <= blockRect.right
        ) {
            return true; // Character is on a block
        }
    }
    return false; // Character is not on any block
}
